# Local development stack. Source is bind-mounted so both services reload
# on change. Not intended for production use.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
      # Bundled plan fixtures, served read-only by /api/fixtures.
      - ./fixtures/plans:/fixtures:ro
    environment:
      DRIFTKING_FIXTURES_DIR: /fixtures
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volumes keep the image's node_modules and the container's
      # .next build cache from being shadowed by (or leaking into) the host.
      - /app/node_modules
      - /app/.next
    environment:
      # The Next.js server proxies /api/* here (see frontend/next.config.ts).
      DRIFTKING_API_URL: http://backend:8000
      # Reliable file watching through bind mounts on macOS/Windows.
      WATCHPACK_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
