[project]
name = "driftking-backend"
version = "0.1.0"
description = "DriftKing API: a visual explorer for Terraform infrastructure changes and drift."
requires-python = ">=3.12"
license = "MIT"

# Dependencies are pinned in requirements.txt (runtime) and
# requirements-dev.txt (tooling). This file only configures tools.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "ASYNC", # flake8-async
  "RUF",   # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
